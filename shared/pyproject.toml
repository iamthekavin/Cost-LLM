[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cost-llm-shared"
version = "0.1.0"
description = "Shared schemas and contract definitions for Cost-LLM monorepo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
]

[tool.setuptools]
package-dir = {"shared" = "."}

[tool.setuptools.packages.find]
namespaces = false
