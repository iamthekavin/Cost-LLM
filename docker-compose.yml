version: "3.8"

services:
  # Local Tier Model Provider (Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: cost-llm-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Member B: Model Gateway
  model-gateway:
    build:
      context: .
      dockerfile: model-gateway/Dockerfile
    container_name: cost-llm-model-gateway
    ports:
      - "8002:8002"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - PORT=8002
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped

  # Member C: Control Plane & Dashboard
  control-plane:
    build:
      context: .
      dockerfile: control-plane/Dockerfile
    container_name: cost-llm-control-plane
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./control_plane.db
      - PORT=8003
    restart: unless-stopped

  # Member A: Router Core
  router-core:
    build:
      context: .
      dockerfile: router-core/Dockerfile
    container_name: cost-llm-router-core
    ports:
      - "8001:8001"
    environment:
      - MODEL_GATEWAY_URL=http://model-gateway:8002
      - CONTROL_PLANE_URL=http://control-plane:8003
      - PORT=8001
    depends_on:
      - model-gateway
      - control-plane
    restart: unless-stopped

  # Member D: Benchmark & Evaluation Engine
  benchmark:
    build:
      context: .
      dockerfile: benchmark/Dockerfile
    container_name: cost-llm-benchmark
    ports:
      - "8004:8004"
    environment:
      - CONTROL_PLANE_URL=http://control-plane:8003
      - MODEL_GATEWAY_URL=http://model-gateway:8002
      - PORT=8004
    depends_on:
      - control-plane
      - model-gateway
    restart: unless-stopped

volumes:
  ollama_models:
    name: cost-llm-ollama-data
